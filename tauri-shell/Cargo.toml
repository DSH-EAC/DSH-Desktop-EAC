[package]
name = "dsh-eac-tauri-shell"
version = "6.0.0"
description = "Deepseek Harness EAC — Tauri ShellHost PoC (ADR 0002 L1)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "process", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
sha2 = "0.10"

# Windows 原生外链/文件打开、语言环境检测及任务栏 Big 图标（WM_SETICON）：
# 经 ShellExecuteW、Globalization API 和 USER32 直接调用。版本对齐依赖树既有 0.61.x。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }
 

[[bin]]
name = "dsh-eac-shell"
path = "src/main.rs"

[profile.dev]
incremental = true
