# EAC pack installer: the Host entry owns the Remote service and the client
# entry mounts the page into the official settings shell.
#
# This self-insert row is the ONLY load path for bundle installs: official
# `dsh plugin add` / pluginManager.installBundle / unified-market all append
# the package to `dsh.profile.bundles`, and a bundle contributes nothing but
# its patch layers — an empty patch would leave the installer unloaded. Do NOT
# additionally hand-write a user-layer insert row for this package: two insert
# rows load the plugin twice and the host service registration fails with
# "service eacPackInstaller has been registered" (web boot death).
- insert:
    - id: dsh-eac-pack-installer
      name: "@dsh-eac/pack-installer"
